- id: '1747871265818'
  alias: Living Room Light - Turn ON When Human Detected
  description: Turns on the living room light when human presence is detected after
    sunset.
  triggers:
  - entity_id:
    - binary_sensor.tze200_3towulqd_ts0601
    - binary_sensor.tze200_3towulqd_ts0601_occupancy
    from: 'off'
    to: 'on'
    trigger: state
  conditions:
  - condition: sun
    after: sunset
  actions:
  - target:
      device_id: 0fbb725040e8c38e93ef6b6ec76fb996
    data:
      brightness_pct: 40
    action: light.turn_on
  mode: restart
- id: '1747871426290'
  alias: Living Room Light - Smoothly Dim and Turn OFF When No Human Detected
  description: Smoothly dims and turns off the living room light when no human presence
    is detected.
  triggers:
  - entity_id:
    - binary_sensor.tze200_3towulqd_ts0601
    - binary_sensor.tze200_3towulqd_ts0601_occupancy
    from: 'on'
    to: 'off'
    trigger: state
  conditions:
  - condition: sun
    after: sunset
  - condition: state
    entity_id: binary_sensor.tze200_3towulqd_ts0601
    state: 'off'
  - condition: state
    entity_id: binary_sensor.tze200_3towulqd_ts0601_occupancy
    state: 'off'
  actions:
  - delay: 00:00:30
  - condition: state
    entity_id: binary_sensor.tze200_3towulqd_ts0601
    state: 'off'
  - condition: state
    entity_id: binary_sensor.tze200_3towulqd_ts0601_occupancy
    state: 'off'
  - repeat:
      count: 15
      sequence:
      - delay:
          seconds: 2
      - target:
          device_id: 0fbb725040e8c38e93ef6b6ec76fb996
        data:
          brightness_step_pct: -3
        action: light.turn_on
  - target:
      device_id: 0fbb725040e8c38e93ef6b6ec76fb996
    action: light.turn_off
  mode: restart
