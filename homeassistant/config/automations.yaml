- id: '1748175674043'
  alias: Dynamic greeting
  description: Greet when entering house (door opens, then motion within 10 seconds)
  triggers:
  - type: opened
    device_id: 0d36a0f31404102e78cbc6c987fcb7e9
    entity_id: 346d40c9a68ee0b5c67ab4f4138a8c32
    domain: binary_sensor
    trigger: device
  conditions: []
  actions:
  - wait_for_trigger:
    - type: occupied
      device_id: b003eb15553189e5c2ebd655397fff3f
      entity_id: fb3ed3e9eceb0fb59fce5fa9b200253b
      domain: binary_sensor
      trigger: device
    timeout:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
    continue_on_timeout: false
  - data:
      entity_id:
      - sensor.greeting_sensor
    action: homeassistant.update_entity
  - action: chime_tts.say
    metadata: {}
    data:
      message: '{{ states(''sensor.greeting_sensor'') }}'
      tts_platform: tts.google_translate_en_com
      chime_path: bells
    target:
      entity_id: media_player.office_speaker
  mode: single
- id: '1748338379450'
  alias: Hourly weather announcement
  description: Say time, temperature, and weather every hour from 9 AM to 10 PM
  triggers:
  - minutes: 0
    trigger: time_pattern
  conditions:
  - condition: time
    after: 09:00:00
    before: '23:01:00'
  actions:
  - action: chime_tts.say
    metadata: {}
    data:
      message: 'The time is {{ now().strftime(''%-I %p'') }}. It''s {{ state_attr(''weather.forecast_home'',
        ''temperature'') }} degrees and {{ states(''weather.forecast_home'') }} outside.

        '
      tts_platform: tts.google_translate_en_com
      chime_path: bells
      tts_speed: 126
    target:
      entity_id: media_player.office_speaker
  mode: single
