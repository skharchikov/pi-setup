title: All Devices
views:
  - title: Home
    path: home
    type: sections
    max_columns: 3
    sections:
      # ---------------- Overview ----------------
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Overview
            heading_style: title
            icon: mdi:home
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: entity
                entity: person.sergei_kharchikov
                content_info: name
                icon_color: blue
              - type: weather
                entity: weather.forecast_home
                show_conditions: true
                show_temperature: true
                visibility:
                  - condition: state
                    entity: weather.forecast_home
                    state_not: unavailable
              - type: template
                icon: mdi:lightbulb-on
                icon_color: amber
                content: "{{ states.light | selectattr('state','eq','on') | list | count }} on"
              - type: template
                icon: mdi:motion-sensor
                icon_color: >
                  {% set occupied = states('binary_sensor.tze200_3towulqd_ts0601_occupancy') == 'on'
                                    or states('binary_sensor.human_presence_sensor_2') == 'on' %}
                  {{ 'red' if occupied else 'grey' }}
                content: >
                  {% set s1 = states('binary_sensor.tze200_3towulqd_ts0601_occupancy') == 'on' %}
                  {% set s2 = states('binary_sensor.human_presence_sensor_2') == 'on' %}
                  {{ ([s1, s2] | select | list | count) ~ '/2' }}
              - type: template
                icon: mdi:door
                icon_color: >
                  {{ 'red' if states('binary_sensor.door_sensor_white') == 'on' else 'grey' }}
                content: >
                  {{ 'Open' if states('binary_sensor.door_sensor_white') == 'on' else 'Closed' }}
                visibility:
                  - condition: state
                    entity: binary_sensor.door_sensor_white
                    state_not: unavailable
              - type: template
                icon: mdi:web
                icon_color: teal
                content: "{{ states('sensor.vodafone_hg8247x6_8n_10_gateway_external_ip') }}"
                visibility:
                  - condition: state
                    entity: sensor.vodafone_hg8247x6_8n_10_gateway_external_ip
                    state_not: unavailable
          - type: custom:mushroom-light-card
            entity: light.all_lights
            name: All Lights
            use_light_color: true
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            fill_container: true
            grid_options:
              columns: full
              rows: 2
            visibility:
              - condition: state
                entity: light.all_lights
                state_not: unavailable

      # ---------------- Living Room ----------------
      - type: grid
        cards:
          - type: heading
            heading: Living Room
            heading_style: subtitle
            icon: mdi:sofa
          - type: custom:auto-entities
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            show_empty: false
            sort:
              method: domain
            filter:
              include:
                - area: Living Room
                  domain: light
                  options:
                    type: custom:mushroom-light-card
                    use_light_color: true
                    show_brightness_control: true
                    show_color_temp_control: true
                    collapsible_controls: true
                    fill_container: true
                - area: Living Room
                  domain: fan
                  options:
                    type: custom:mushroom-fan-card
                    show_percentage_control: true
                    show_oscillate_control: true
                - area: Living Room
                  domain: climate
                  options:
                    type: custom:mushroom-climate-card
                - area: Living Room
                  domain: media_player
                  options:
                    type: custom:mushroom-media-player-card
                    use_media_info: true
                    media_controls: [play_pause_stop, previous, next]
                    volume_controls: [volume_mute, volume_set]
                - area: Living Room
                  domain: vacuum
                  options:
                    type: custom:mushroom-vacuum-card
                    commands: [start_pause, stop, return_home]
                - area: Living Room
                  domain: [switch, cover, lock]
                  options:
                    type: custom:mushroom-entity-card
                    tap_action:
                      action: toggle
              exclude:
                - state: unavailable
                - state: unknown
                - entity_id: "*_pre_release"

      # ---------------- Bedroom ----------------
      - type: grid
        cards:
          - type: heading
            heading: Bedroom
            heading_style: subtitle
            icon: mdi:bed
          - type: custom:auto-entities
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            show_empty: false
            sort:
              method: domain
            filter:
              include:
                - area: Bedroom
                  domain: light
                  options:
                    type: custom:mushroom-light-card
                    use_light_color: true
                    show_brightness_control: true
                    show_color_temp_control: true
                    collapsible_controls: true
                    fill_container: true
                - area: Bedroom
                  domain: fan
                  options:
                    type: custom:mushroom-fan-card
                    show_percentage_control: true
                    show_oscillate_control: true
                - area: Bedroom
                  domain: climate
                  options:
                    type: custom:mushroom-climate-card
                - area: Bedroom
                  domain: media_player
                  options:
                    type: custom:mushroom-media-player-card
                    use_media_info: true
                    media_controls: [play_pause_stop, previous, next]
                    volume_controls: [volume_mute, volume_set]
                - area: Bedroom
                  domain: vacuum
                  options:
                    type: custom:mushroom-vacuum-card
                    commands: [start_pause, stop, return_home]
                - area: Bedroom
                  domain: [switch, cover, lock]
                  options:
                    type: custom:mushroom-entity-card
                    tap_action:
                      action: toggle
              exclude:
                - state: unavailable
                - state: unknown
                - entity_id: "*_pre_release"

      # ---------------- Office ----------------
      - type: grid
        cards:
          - type: heading
            heading: Office
            heading_style: subtitle
            icon: mdi:desk
          - type: custom:printwatch-card
            printer_name: P1S
            camera_refresh_rate: 1000
            camera_entity: camera.p1s_01p00c541700728_camera
            online_entity: binary_sensor.p1s_01p00c541700728_online
            cover_image_entity: image.p1s_01p00c541700728_cover_image
            print_status_entity: sensor.p1s_01p00c541700728_print_status
            current_stage_entity: sensor.p1s_01p00c541700728_current_stage
            task_name_entity: sensor.p1s_01p00c541700728_task_name
            progress_entity: sensor.p1s_01p00c541700728_print_progress
            current_layer_entity: sensor.p1s_01p00c541700728_current_layer
            total_layers_entity: sensor.p1s_01p00c541700728_total_layer_count
            remaining_time_entity: sensor.p1s_01p00c541700728_remaining_time
            nozzle_temp_entity: sensor.p1s_01p00c541700728_nozzle_temperature
            nozzle_target_temp_entity: sensor.p1s_01p00c541700728_nozzle_target_temperature
            bed_temp_entity: sensor.p1s_01p00c541700728_bed_temperature
            bed_target_temp_entity: sensor.p1s_01p00c541700728_bed_target_temperature
            speed_profile_entity: sensor.p1s_01p00c541700728_speed_profile
            aux_fan_entity: fan.p1s_01p00c541700728_aux_fan
            chamber_light_entity: light.p1s_01p00c541700728_chamber_light
            print_length_entity: sensor.p1s_01p00c541700728_print_length
            print_weight_entity: sensor.p1s_01p00c541700728_print_weight
            external_spool_entity: sensor.p1s_01p00c541700728_externalspool_external_spool
            active_tray_index_entity: sensor.p1s_01p00c541700728_active_tray
            ams_slot1_entity: sensor.p1s_01p00c541700728_ams_1_tray_1
            ams_slot2_entity: sensor.p1s_01p00c541700728_ams_1_tray_2
            ams_slot3_entity: sensor.p1s_01p00c541700728_ams_1_tray_3
            ams_slot4_entity: sensor.p1s_01p00c541700728_ams_1_tray_4
            pause_button_entity: button.p1s_01p00c541700728_pause
            resume_button_entity: button.p1s_01p00c541700728_resume
            stop_button_entity: button.p1s_01p00c541700728_stop
          - type: custom:auto-entities
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            show_empty: false
            sort:
              method: domain
            filter:
              include:
                - area: Office
                  domain: light
                  options:
                    type: custom:mushroom-light-card
                    use_light_color: true
                    show_brightness_control: true
                    collapsible_controls: true
                    fill_container: true
                - area: Office
                  domain: fan
                  options:
                    type: custom:mushroom-fan-card
                    show_percentage_control: true
                - area: Office
                  domain: media_player
                  options:
                    type: custom:mushroom-media-player-card
                    use_media_info: true
                - area: Office
                  domain: vacuum
                  options:
                    type: custom:mushroom-vacuum-card
                    commands: [start_pause, stop, return_home]
                - area: Office
                  domain: [switch, cover, lock]
                  options:
                    type: custom:mushroom-entity-card
                    tap_action:
                      action: toggle
              exclude:
                - state: unavailable
                - state: unknown
                - entity_id: "*_pre_release"
                - entity_id: "*p1s_01p00c541700728*"

      # ---------------- Other (unassigned) ----------------
      - type: grid
        cards:
          - type: heading
            heading: Other
            heading_style: subtitle
            icon: mdi:dots-horizontal
          - type: custom:auto-entities
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            show_empty: false
            sort:
              method: domain
            filter:
              include:
                - domain: light
                  options:
                    type: custom:mushroom-light-card
                    show_brightness_control: true
                    collapsible_controls: true
                    fill_container: true
                - domain: media_player
                  options:
                    type: custom:mushroom-media-player-card
                    use_media_info: true
                - domain: [fan, switch, cover, lock, vacuum, climate]
                  options:
                    type: custom:mushroom-entity-card
                    tap_action:
                      action: toggle
              exclude:
                - state: unavailable
                - state: unknown
                - area: Living Room
                - area: Bedroom
                - area: Office
                - area: Kitchen
                - area: Bathroom
                - entity_id: "*_pre_release"
                - entity_id: light.all_lights
                - entity_id: light.bedroom_lights
                - entity_id: light.living_room_lights
                - entity_id: "*p1s_01p00c541700728*"

      # ---------------- Weather ----------------
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Weather
            heading_style: subtitle
            icon: mdi:weather-partly-cloudy
          - type: weather-forecast
            entity: weather.forecast_home
            show_current: true
            show_forecast: true
            forecast_type: daily
            theme: ios-dark-mode
            visibility:
              - condition: state
                entity: weather.forecast_home
                state_not: unavailable
