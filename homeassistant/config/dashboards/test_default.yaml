title: Mobile
views:
  - title: Home
    path: home
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Welcome
            heading_style: title
            icon: mdi:home-account
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: entity
                entity: person.sergei_kharchikov
                content_info: name
                icon_color: blue
              - type: weather
                entity: weather.forecast_home
                show_conditions: true
                show_temperature: true
                visibility:
                  - condition: state
                    entity: weather.forecast_home
                    state_not: unavailable
              - type: template
                entity: sensor.vodafone_hg8247x6_8n_10_gateway_external_ip
                content: "{{ states('sensor.vodafone_hg8247x6_8n_10_gateway_external_ip') }}"
                icon: mdi:web
                icon_color: teal
                visibility:
                  - condition: state
                    entity: sensor.vodafone_hg8247x6_8n_10_gateway_external_ip
                    state_not: unavailable

      - type: grid
        cards:
          - type: heading
            heading: Presence
            heading_style: subtitle
            icon: mdi:motion-sensor
          - type: custom:mushroom-entity-card
            entity: binary_sensor.tze200_3towulqd_ts0601_occupancy
            name: Living Room
            icon: mdi:sofa
            icon_color: amber
            visibility:
              - condition: state
                entity: binary_sensor.tze200_3towulqd_ts0601_occupancy
                state_not: unavailable
          - type: custom:mushroom-entity-card
            entity: binary_sensor.human_presence_sensor_2
            name: Bedroom
            icon: mdi:bed
            icon_color: indigo
            visibility:
              - condition: state
                entity: binary_sensor.human_presence_sensor_2
                state_not: unavailable

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Lights
            heading_style: subtitle
            icon: mdi:lightbulb-group
          - type: custom:mushroom-light-card
            entity: light.all_lights
            name: All Lights
            use_light_color: true
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            grid_options:
              columns: 12
              rows: 2
            visibility:
              - condition: state
                entity: light.all_lights
                state_not: unavailable
          - type: custom:mushroom-light-card
            entity: light.bedroom_lights
            name: Bedroom
            use_light_color: true
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            grid_options:
              columns: 6
              rows: 2
            visibility:
              - condition: state
                entity: light.bedroom_lights
                state_not: unavailable
          - type: custom:mushroom-light-card
            entity: light.living_room_lights
            name: Living Room
            use_light_color: true
            show_brightness_control: true
            show_color_control: true
            collapsible_controls: true
            grid_options:
              columns: 6
              rows: 2
            visibility:
              - condition: state
                entity: light.living_room_lights
                state_not: unavailable
          - type: custom:mushroom-light-card
            entity: light.yeelink_monoa_488c_light
            name: Yeelight
            use_light_color: true
            show_brightness_control: true
            show_color_temp_control: true
            collapsible_controls: true
            grid_options:
              columns: 12
              rows: 2
            visibility:
              - condition: state
                entity: light.yeelink_monoa_488c_light
                state_not: unavailable

      - type: grid
        cards:
          - type: heading
            heading: Climate
            heading_style: subtitle
            icon: mdi:fan
          - type: custom:mushroom-fan-card
            entity: fan.dmaker_1c_8495_fan
            name: Tower Fan
            show_oscillate_control: true
            show_percentage_control: true
            show_direction_control: false
            collapsible_controls: true
            grid_options:
              columns: 12
              rows: 2
            visibility:
              - condition: state
                entity: fan.dmaker_1c_8495_fan
                state_not: unavailable

      - type: grid
        cards:
          - type: heading
            heading: Media & Cleaning
            heading_style: subtitle
            icon: mdi:remote-tv
          - type: custom:mushroom-media-player-card
            entity: media_player.xgimi_horizon_pro_2
            name: Projector
            primary_info: name
            secondary_info: state
            icon_type: icon
            show_volume_level: true
            volume_controls:
              - volume_set
              - volume_buttons
            media_controls:
              - on_off
              - play_pause_stop
            collapsible_controls: true
            grid_options:
              columns: 12
              rows: 2
            visibility:
              - condition: state
                entity: media_player.xgimi_horizon_pro_2
                state_not: unavailable
          - type: custom:mushroom-vacuum-card
            entity: vacuum.xiaomi_b106eu_5513_robot_cleaner
            name: Vacuum
            commands:
              - on_off
              - start_pause
              - clean_spot
              - return_home
            collapsible_controls: true
            grid_options:
              columns: 12
              rows: 2
            visibility:
              - condition: state
                entity: vacuum.xiaomi_b106eu_5513_robot_cleaner
                state_not: unavailable

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Weather
            heading_style: subtitle
            icon: mdi:weather-partly-cloudy
          - type: weather-forecast
            entity: weather.forecast_home
            show_current: true
            show_forecast: true
            forecast_type: daily
            theme: ios-dark-mode
            visibility:
              - condition: state
                entity: weather.forecast_home
                state_not: unavailable
